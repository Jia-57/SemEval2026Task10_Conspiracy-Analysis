<svg viewBox="0 0 510 400" xmlns="http://www.w3.org/2000/svg" width="100%" role="img">
  <title>PsyCoMark live demo card</title>
  <desc>An animated card showing a Reddit comment streaming in with highlighted words for article, Bolivia, US, coups, and Bolivia's, followed by the model's reply streaming in with matching color-coded labels for conspiracy verdict, evidence, victim, actor, and action.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    @keyframes r1  { 0%,2.5%  {opacity:0;} 3%,88%  {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r2  { 0%,6.5%  {opacity:0;} 7%,88%  {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r3  { 0%,11.5% {opacity:0;} 12%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r4  { 0%,17.5% {opacity:0;} 18%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r5  { 0%,21.5% {opacity:0;} 22%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r6  { 0%,25.5% {opacity:0;} 26%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r7  { 0%,31.5% {opacity:0;} 32%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r8  { 0%,35.5% {opacity:0;} 36%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r9  { 0%,40.5% {opacity:0;} 41%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes typingFade { 0%,41.5% {opacity:0;} 42%,47% {opacity:1;} 48%,100% {opacity:0;} }
    @keyframes r10 { 0%,47.5% {opacity:0;} 48%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r11 { 0%,51.5% {opacity:0; transform:scale(0.75);} 52%,88% {opacity:1; transform:scale(1);} 95%,100% {opacity:0; transform:scale(0.75);} }
    @keyframes r12 { 0%,56.5% {opacity:0;} 57%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r13 { 0%,60.5% {opacity:0;} 61%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r14 { 0%,64.5% {opacity:0;} 65%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r15 { 0%,68.5% {opacity:0;} 69%,88% {opacity:1;} 95%,100% {opacity:0;} }
    @keyframes r16 { 0%,73.5% {opacity:0;} 74%,88% {opacity:1;} 95%,100% {opacity:0;} }
    .r1{animation:r1 9s linear infinite} .r2{animation:r2 9s linear infinite}
    .r3{animation:r3 9s linear infinite} .r4{animation:r4 9s linear infinite}
    .r5{animation:r5 9s linear infinite} .r6{animation:r6 9s linear infinite}
    .r7{animation:r7 9s linear infinite} .r8{animation:r8 9s linear infinite}
    .r9{animation:r9 9s linear infinite}
    .r10{animation:r10 9s linear infinite} .r11{animation:r11 9s linear infinite}
    .r12{animation:r12 9s linear infinite} .r13{animation:r13 9s linear infinite}
    .r14{animation:r14 9s linear infinite} .r15{animation:r15 9s linear infinite}
    .r16{animation:r16 9s linear infinite}
    .typing{animation:typingFade 9s linear infinite}
  </style>

  <rect x="6" y="6" width="498" height="388" rx="22" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2" filter="url(#shadow)"/>

  <rect x="32" y="30" width="420" height="132" rx="18" fill="#F0F0F1"/>
  <image x="426" y="124" width="52" height="52" href="data:image/png;base64,"/>

  <text x="54" y="58" font-size="14" font-family="sans-serif" fill="#1F2430">
    <tspan class="r1">A great </tspan>
    <tspan class="r2" fill="#E2903A">article</tspan>
    <tspan class="r2">, on what's taking place in </tspan>
    <tspan class="r3" fill="#D4A72C">Bolivia</tspan>
    <tspan class="r3">, referencing</tspan>
  </text>
  <text x="54" y="82" font-size="14" font-family="sans-serif" fill="#1F2430">
    <tspan class="r4">some similar </tspan>
    <tspan class="r5" fill="#E2585A">US</tspan>
    <tspan class="r5"> backed </tspan>
    <tspan class="r6" fill="#3FAE6B">coups</tspan>
    <tspan class="r6"> in the region as well as</tspan>
  </text>
  <text x="54" y="106" font-size="14" font-family="sans-serif" fill="#1F2430">
    <tspan class="r7">recounting some of </tspan>
    <tspan class="r8" fill="#2EB4B4">Bolivia's</tspan>
    <tspan class="r8"> history and western policy</tspan>
  </text>
  <text x="54" y="130" font-size="14" font-family="sans-serif" fill="#1F2430">
    <tspan class="r9">towards the country.</tspan>
  </text>

  <rect x="58" y="222" width="420" height="118" rx="18" fill="#F0F0F1"/>
  <image x="32" y="208" width="52" height="52" href="data:image/png;base64,"/>

  <g class="typing">
    <circle cx="86" cy="258" r="3" fill="#9CA3AF"/>
    <circle cx="98" cy="258" r="3" fill="#9CA3AF"/>
    <circle cx="110" cy="258" r="3" fill="#9CA3AF"/>
  </g>

  <text x="80" y="262" font-size="14" font-family="sans-serif" fill="#1F2430">
    <tspan class="r10">Conspiracy: </tspan>
  </text>
  <g class="r11" transform-origin="193 257">
    <rect x="170" y="246" width="46" height="22" rx="11" fill="#8B5CF6"/>
    <text x="193" y="262" font-size="13" font-weight="600" font-family="sans-serif" fill="#FFFFFF" text-anchor="middle">Yes</text>
  </g>

  <text x="80" y="292" font-size="13" font-family="sans-serif" fill="#1F2430">
    <tspan class="r12">Evidence: </tspan>
    <tspan class="r12" fill="#E2903A">article</tspan>
    <tspan class="r13">  Victim: </tspan>
    <tspan class="r13" fill="#D4A72C">Bolivia</tspan>
    <tspan class="r13">,</tspan>
    <tspan class="r14">  Actor: </tspan>
    <tspan class="r14" fill="#E2585A">US</tspan>
    <tspan class="r15">  Action: </tspan>
    <tspan class="r15" fill="#3FAE6B">coups</tspan>
  </text>
  <text x="80" y="320" font-size="13" font-family="sans-serif" fill="#1F2430">
    <tspan class="r16">Victim: </tspan>
    <tspan class="r16" fill="#2EB4B4">Bolivia's</tspan>
  </text>
</svg>
